[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo-impute"
version = "0.2.0"
description = "Phylogenetic imputation of missing genotypes using a 4-state CTMC model"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "Tyler K. Chafin"},
]
dependencies = [
    "numpy >=1.24",
    "pandas >=2.0",
    "scipy >=1.10",
    "snpio >=1.3",
    "toytree",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
phylo-impute = "phylo_impute.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phylo_impute*"]
